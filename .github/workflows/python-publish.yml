name: Publish package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build the Source Distribution (sdist).
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install build
      - name: Build sdist
        run: python -m build --sdist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v6
        with:
          name: pyhelp-sdist
          path: dist/*.tar.gz

  # Build the compiled wheels for each Python version and OS.
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      # cibuildwheel config lives in pyproject.toml [tool.cibuildwheel] so that
      # a local `cibuildwheel --platform linux` run reproduces CI exactly.
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.19.0
      - uses: actions/upload-artifact@v6
        with:
          name: pyhelp-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # Publish to PyPI.
  pypi-publish:
    name: Publish package to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/pyhelp/
    permissions:
      id-token: write  # IMPORTANT: mandatory for PyPI trusted publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pyhelp-*
          path: dist
          merge-multiple: true
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
