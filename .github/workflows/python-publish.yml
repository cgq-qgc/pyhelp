name: Publish package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build the Source Distribution (sdist).
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install build
      - name: Build sdist
        run: python -m build --sdist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v6
        with:
          name: pyhelp-sdist
          path: dist/*.tar.gz

  # Build the compiled Windows wheels for each Python version.
  build-wheels:
    name: Build wheels for Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build meson-python ninja numpy wheel
      - name: Build wheel
        run: python -m build --wheel
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: pyhelp-wheels-${{ matrix.python-version }}
          path: dist/*.whl

  # Publish to PyPI.
  pypi-publish:
    name: Publish package to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/pyhelp/
    permissions:
      id-token: write  # IMPORTANT: mandatory for PyPI trusted publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pyhelp-*
          path: dist
          merge-multiple: true
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
